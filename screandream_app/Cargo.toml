[package]
name = "screendream"
version = "0.1.0"
edition = "2024"

[features]
default = ["gpu-render", "macos-capture"]
gpu-render = ["dep:wgpu"]
macos-capture = ["dep:screencapturekit"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
ply = "0.1.0"
pollster = "0.4"
rustfft = "6"
thiserror = "2"
wgpu = { version = "24", optional = true }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5", features = ["macos_14_0"], optional = true }
