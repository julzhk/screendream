[package]
name = "screendream"
version = "0.1.0"
edition = "2024"

[features]
default = ["gpu-render", "macos-capture"]
gpu-render = ["dep:wgpu", "dep:glyphon"]
macos-capture = ["dep:screencapturekit"]

[dependencies]
anyhow = "1"
glyphon = { version = "0.8", optional = true }
bytemuck = { version = "1", features = ["derive"] }
ply = "0.1.0"
pollster = "0.4"
rustfft = "6"
thiserror = "2"
wgpu = { version = "24", optional = true }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5", features = ["macos_14_0"], optional = true }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

# macOS .app bundle, built with `cargo bundle --release` (see README.md).
[package.metadata.bundle]
name = "Screendream"
identifier = "com.screendream.visualizer"
icon = ["resources/icon/icon_*.png"]
resources = ["assets/default-scene.ply"]
category = "public.app-category.entertainment"
short_description = "Audio-reactive visualizer driven by live system audio."

[package.metadata.bundle.osx]
minimum_system_version = "14.0"
info_plist_exts = ["resources/Info.plist.ext"]
